name: Final documentation review
on:
  push:
    branches: [docs/user-friendly-guides-20261005]
    paths: [.github/workflows/docs-final-review.yml]
permissions:
  contents: write
jobs:
  review:
    if: github.repository == 'cepeter/SillyTavern-Telegram-Bridge' && github.ref == 'refs/heads/docs/user-friendly-guides-20261005'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/user-friendly-guides-20261005
          fetch-depth: 0
      - name: Apply exact reviewed passages
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 8b26ca488c420f27cd403bd8b0b1f626c2434498 HEAD
          git diff --exit-code 8b26ca488c420f27cd403bd8b0b1f626c2434498 HEAD -- README.md CONTRIBUTING.md docs/installation.md docs/user-guide.md docs/configuration.md docs/operations.md docs/miniapp.md docs/token-usage.md
          python3 - <<'PY'
          from pathlib import Path
          import re, runpy, subprocess, textwrap

          def edit(name, old, new):
              p = Path(name)
              s = p.read_text()
              assert s.count(old) == 1, (name, old)
              p.write_text(s.replace(old, new))

          edit('docs/operations.md', 'git switch main\n', 'test "$(git branch --show-current)" = main || { echo "Expected the installed main branch; stop and review this checkout" >&2; exit 1; }\n')
          edit('docs/installation.md', "administrator's username. That grants local operator access, not Funnel authorization. The Mini App still\n", "administrator's username. That grants local operator access, not Funnel\nauthorization. The Mini App still\n")
          edit('docs/installation.md', 'starting or restarting the service; do not reset your database to fix a typo. Then open the bot and follow the\n', 'starting or restarting the service; do not reset your database to fix a typo.\n\nThen open the bot and follow the\n')
          edit('docs/miniapp.md', 'original is still active. The app tracks this as an operation belonging to you and the original session.\nRetrying that operation retrieves its result instead of creating a second branch; a later explicit request can create a different alternate ending.\nThe original stays closed. A memory warning means external seeding was unavailable,\nnot that the new local story was lost.', 'original is still active. The app tracks this as an operation belonging to you\nand the original session. Retrying that operation retrieves its result instead\nof creating a second branch; a later explicit request can create a different\nalternate ending. The original stays closed. A memory warning means the copied\nhistory could not be added to external memory, not that the new local story was lost.')
          edit('docs/miniapp.md', "private Tailscale network is not the app's login mechanism. The installer discovers a `/miniapp/` URL when the configured URL is\n", "private Tailscale network is not the app's login mechanism. The installer\ndiscovers a `/miniapp/` URL when the configured URL is\n")
          edit('docs/token-usage.md', 'completion time, status, duration and any available numeric counters. It does **not** store prompts, response\n', 'completion time, status, duration and any available numeric counters. It does\n**not** store prompts, response\n')
          edit('docs/token-usage.md', 'saved story messages appears under `director_reconcile`. An automatic reassessment runs only when an event or\n', 'saved story messages appears under `director_reconcile`. An automatic\nreassessment runs only when an event or\n')
          edit('docs/user-guide.md', 'describes saved story facts, not proposed future events. It is separate from `/scene`, which tracks\n', 'describes saved story facts, not proposed future events. It is separate from\n`/scene`, which tracks\n')
          edit('docs/user-guide.md', 'background is called reconciliation. It uses the Utility model and is reported as `director_reconcile` usage. Opening a style\n', 'background is called reconciliation. It uses the Utility model and is reported\nas `director_reconcile` usage. Opening a style\n')
          edit('docs/user-guide.md', 'something that has happened in the story. **Reassess now** asks the configured Director model for a fresh plan.\n', 'something that has happened in the story. **Reassess now** asks the configured\nDirector model for a fresh plan.\n')
          edit('docs/user-guide.md', 'the bridge has updated its story record, the Director prepares a brief and the Story model writes a **separate\n', 'the bridge has updated its story record, the Director prepares a brief and the\nStory model writes a **separate\n')
          docs = ['README.md','CONTRIBUTING.md','docs/installation.md','docs/user-guide.md','docs/configuration.md','docs/operations.md','docs/miniapp.md','docs/token-usage.md']
          blocks = 0
          for name in docs:
              text = Path(name).read_text()
              for code in re.findall(r'^[ \t]*```bash[ \t]*\n(.*?)^[ \t]*```[ \t]*$', text, re.S | re.M):
                  subprocess.run(['bash', '-n'], input=textwrap.dedent(code), text=True, check=True)
                  blocks += 1
          tests = runpy.run_path('tests/test_installation_docs.py')
          for name, fn in tests.items():
              if name.startswith('test_') and callable(fn):
                  fn()
          manual = Path('docs/operations.md').read_text().split('### Manual update\n',1)[1].split('### Database migrations',1)[0]
          assert 'git switch main' not in manual
          assert manual.index('git branch --show-current') < manual.index('git fetch origin')
          assert manual.index('verify-tag "$tag"') < manual.index('systemctl --user stop') < manual.index('git checkout -B main "$tag^{commit}"')
          assert 'git merge-base --is-ancestor HEAD "$tag^{commit}"' in manual
          original = subprocess.check_output(['git','show','39bac3de0369a7580e7d854c99622d9ac83f30de:docs/configuration.md'],text=True)
          assert {s for s in original.splitlines() if s.startswith('| `')} <= set(Path('docs/configuration.md').read_text().splitlines())
          subprocess.run(['git','diff','--check'],check=True)
          print(f'10 existing documentation tests, {blocks} Bash examples and update safety/reference guards passed')
          PY
      - name: Recheck GitHub Markdown rendering and all guide links
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.parse, urllib.request
          from pathlib import Path
          from html.parser import HTMLParser
          root = Path.cwd()
          docs = ['README.md','CONTRIBUTING.md','docs/installation.md','docs/user-guide.md','docs/configuration.md','docs/operations.md','docs/miniapp.md','docs/token-usage.md']
          cache = {}
          class Outline(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.headings = []
                  self.heading = None
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if 'id' in a:
                      self.ids.add(a['id'].removeprefix('user-content-'))
                  if re.fullmatch('h[1-6]', tag):
                      self.heading = []
              def handle_data(self, data):
                  if self.heading is not None:
                      self.heading.append(data)
              def handle_endtag(self, tag):
                  if re.fullmatch('h[1-6]', tag) and self.heading is not None:
                      self.headings.append(''.join(self.heading))
                      self.heading = None
          def render(path):
              if path in cache:
                  return cache[path]
              request = urllib.request.Request('https://api.github.com/markdown', data=json.dumps({'text': path.read_text(), 'mode': 'gfm', 'context': 'cepeter/SillyTavern-Telegram-Bridge'}).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as r:
                  html = r.read(2000000).decode()
              outline = Outline()
              outline.feed(html)
              assert outline.headings, path
              if not outline.ids:
                  counts = {}
                  for heading in outline.headings:
                      slug = re.sub(r'[^\w -]', '', heading.lower()).replace(' ', '-')
                      count = counts.get(slug, 0)
                      counts[slug] = count + 1
                      outline.ids.add(slug + (f'-{count}' if count else ''))
              cache[path] = outline.ids
              return outline.ids
          count = 0
          for name in docs:
              p = root / name
              render(p)
              text = re.sub(r'```.*?```', '', p.read_text(), flags=re.S)
              for target in re.findall(r'\[[^\]]+\]\(([^)]+)\)', text) + re.findall(r'<img[^>]+src="([^"]+)"', text):
                  u = urllib.parse.urlsplit(target)
                  if u.scheme or u.netloc:
                      continue
                  dest = (p.parent / urllib.parse.unquote(u.path)).resolve() if u.path else p
                  assert dest.is_relative_to(root) and dest.exists(), (name, target)
                  if u.fragment and dest.suffix == '.md':
                      assert urllib.parse.unquote(u.fragment) in render(dest), (name, target)
                  count += 1
          print(f'{len(cache)} GitHub-rendered guides; {count} local links/images/anchors passed')
          PY
      - name: Publish reviewed documentation changes only
        shell: bash
        run: |
          set -euo pipefail
          git add -- docs/installation.md docs/miniapp.md docs/operations.md docs/token-usage.md docs/user-guide.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: clarify final review wording and refuse unexpected update branches'
          git push origin HEAD:refs/heads/docs/user-friendly-guides-20261005
          printf 'reviewed_head=%s\n' "$(git rev-parse HEAD)"
