name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: |
            requirements.lock
            requirements-dev.lock

      - name: Install locked runtime dependencies
        run: uv pip install --system --python python --require-hashes -r requirements.lock

      - name: Install development test tooling
        run: uv pip install --system --python python --require-hashes -r requirements-dev.lock

      - name: Validate dependency environment
        run: python -m pip check

      - name: Set up Node for development-only Mini App tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/miniapp-ui/package-lock.json
      - name: Install locked DOM test tooling
        run: npm ci --prefix tests/miniapp-ui --include=dev --ignore-scripts --no-audit --no-fund
      - name: Exercise Mini App pages and session safety
        env:
          MINIAPP_JSDOM_ROOT: ${{ github.workspace }}/tests/miniapp-ui
          PYTHON: python
        run: node --experimental-vm-modules tools/miniapp_ui_smoke.mjs
      - name: Run full test suite
        run: >-
          python -m pytest -q -n auto --maxprocesses=4 --dist=loadfile
          --cov --cov-report=term-missing:skip-covered
          --cov-report=json:coverage.json --cov-report=xml:coverage.xml

      - name: Check security-critical coverage
        run: python tools/check_security_coverage.py coverage.json

      - name: Publish application coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: application-coverage
          path: |
            coverage.json
            coverage.xml
          if-no-files-found: warn
          retention-days: 14

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history for secret scanning
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: |
            requirements.lock
            requirements-dev.lock

      - name: Install hash-locked audit tooling
        run: uv pip install --system --python python --require-hashes -r requirements-dev.lock

      - name: Audit locked dependencies
        run: |
          python -m pip_audit --require-hashes --disable-pip -r requirements.lock
          python -m pip_audit --require-hashes --disable-pip -r requirements-dev.lock

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: |
            requirements-dev.lock

      - name: Install static analysis tooling
        run: uv pip install --system --python python --require-hashes -r requirements-dev.lock

      - name: Check runtime lock and manifests
        run: python tools/check_dependency_lock.py

      - name: Check dependency direction
        run: python tools/static_analysis.py

      - name: Lint complete Python tree
        run: python -m ruff check .

      - name: Check Python formatting
        run: python -m ruff format --check .

      - name: Check typed-surface baseline
        run: |
          count=$(python tools/static_analysis.py --print-type-target-count)
          minimum=$(python -c 'import json; print(json.load(open("tools/type_surface_baseline.json"))["minimum_typed_files"])')
          echo "typed_files=$count minimum=$minimum"
          test "$count" -ge "$minimum"

      - name: Run mypy static surface
        run: python tools/static_analysis.py --print-type-targets | xargs python -m mypy
