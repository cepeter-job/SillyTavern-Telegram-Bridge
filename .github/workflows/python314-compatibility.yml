name: Python 3.14 migration compatibility

on:
  workflow_dispatch:
    inputs:
      trace_resource_allocations:
        description: "Run bounded SQLite allocation diagnostics, not the full regression"
        type: boolean
        required: false
        default: false
      resource_trace_tests:
        description: "One to four existing tests/test_*.py files separated by spaces"
        type: string
        required: false
        default: "tests/test_transcript_delivery_recovery.py"
      native_debug_backtrace:
        description: "Capture isolated CTranslate2 Python 3.14 allocator abort using GDB"
        type: boolean
        required: false
        default: false
  pull_request:
    paths:
      - ".github/workflows/python314-compatibility.yml"
      - "requirements-py314.lock"
      - "requirements-dev-py314.lock"
      - "config/python314-constraints.txt"
      - "tools/check_dependency_lock.py"
      - "tests/test_dependency_lock.py"
      - "tests/test_python314_native_imports.py"
      - "docs/python-314-migration.md"
      - "bridge/**"

permissions:
  contents: read

concurrency:
  # Manual native diagnostics must not cancel queued PR regressions (or vice versa).
  group: python314-migration-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  voice-enabled-native-preflight:
    if: ${{ !inputs.native_debug_backtrace && !inputs.trace_resource_allocations }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up CPython 3.14.8
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.8"
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true
          cache-dependency-glob: requirements-dev-py314.lock
      - name: Confirm final interpreter and install full hash-locked development environment
        run: |
          set -euo pipefail
          python -c 'import sys; assert sys.version_info[:3] == (3,14,8) and sys.version_info.releaselevel == "final"'
          uv pip install --system --python python --require-hashes -r requirements-dev-py314.lock
          uv pip check --python python
      - name: Verify native voice-enabled integrations and CPU-compatible NumPy
        run: |
          python -c 'import av, ctranslate2, faster_whisper, numpy, onnxruntime, hindsight_client, aiohttp, yaml, sqlite3, ssl; assert numpy.__version__ == "2.3.5"; print("Python3.14.8 native_voice_imports=passed")'
          # Runtime ownership checks must cover extension finalizers at process exit.
          # The target VPS has reproduced a CTranslate2 shutdown abort under -X dev.
          python -X dev -W error::ResourceWarning -c 'import ctranslate2; print("Python3.14.8 native_extension_exit_probe=started")'
          python -X dev -W error::ResourceWarning -m pytest -q -n 0 tests/test_python314_native_imports.py

  full-regression:
    if: ${{ !inputs.trace_resource_allocations && !inputs.native_debug_backtrace }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    # CLI flags alone do not reach xdist workers or their subprocesses.
    env:
      PYTHONDEVMODE: "1"
      PYTHONWARNINGS: "error::ResourceWarning"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up CPython 3.14.8
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.8"
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true
          cache-dependency-glob: |
            requirements-py314.lock
            requirements-dev-py314.lock
      - name: Install complete hash-locked native and development environment
        run: |
          set -euo pipefail
          uv pip install --system --python python --require-hashes -r requirements-dev-py314.lock
          uv pip check --python python
          python tools/check_dependency_lock.py --python-version 3.14 --lock requirements-py314.lock --development-lock requirements-dev-py314.lock
      - name: Run full Python 3.14 strict regression suite and original coverage gate
        run: |
          set -euo pipefail
          python -X dev -W error::ResourceWarning -m pytest -q             -n auto --maxprocesses=4 --dist=loadfile             --cov=bridge --cov-fail-under=76             --cov-report=json:python314-coverage.json             --cov-report=xml:python314-coverage.xml             --junitxml=python314-junit.xml --durations=20 --durations-min=1             2>&1 | tee python314-pytest.log
          # xdist can report success before a worker aborts during finalization.
          if grep -E 'Fatal Python error:|_PyMem_DebugRawFree|Segmentation fault|Aborted \(core dumped\)' python314-pytest.log; then
            echo "::error::Native shutdown crash detected in pytest output"
            exit 1
          fi
          python tools/check_security_coverage.py python314-coverage.json
      - name: Retain non-advisory regression evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python314-full-regression
          path: |
            python314-pytest.log
            python314-junit.xml
            python314-coverage.json
            python314-coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  resource-owner-trace:
    if: ${{ inputs.trace_resource_allocations && !inputs.native_debug_backtrace }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up CPython 3.14.8
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.8"
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true
          cache-dependency-glob: requirements-dev-py314.lock
      - name: Install native voice-enabled developer lock
        run: |
          set -euo pipefail
          uv pip install --system --python python --require-hashes -r requirements-dev-py314.lock
          uv pip check --python python
      - name: Trace only selected test modules with strict warnings
        id: trace
        env:
          TRACE_TEST_FILES: ${{ inputs.resource_trace_tests }}
        run: |
          set -euo pipefail
          if [[ -z "$TRACE_TEST_FILES" || "$TRACE_TEST_FILES" == *$'\n'* ]]; then
            echo "::error::Select one to four existing test files"
            exit 2
          fi
          read -r -a targets <<< "$TRACE_TEST_FILES"
          if (( ${#targets[@]} < 1 || ${#targets[@]} > 4 )); then
            echo "::error::Too many or no test targets"
            exit 2
          fi
          for path in "${targets[@]}"; do
            if [[ ! "$path" =~ ^tests/test_[a-zA-Z0-9_]+\.py$ || ! -f "$path" ]]; then
              echo "::error::Invalid trace target"
              exit 2
            fi
          done
          echo "Focused SQLite allocation tracing; NOT a full-regression pass" >> "$GITHUB_STEP_SUMMARY"
          PYTHONTRACEMALLOC=6 python -X dev -W error::ResourceWarning \
            -m pytest -q -n 0 "${targets[@]}" \
            --junitxml=python314-trace-junit.xml \
            --durations=20 --durations-min=1 \
            2>&1 | tee python314-trace.log
      - name: Retain allocation traces independently of exit status
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python314-sqlite-allocation-trace
          path: |
            python314-trace.log
            python314-trace-junit.xml
          if-no-files-found: ignore
          retention-days: 14

  native-debugger:
    if: ${{ inputs.native_debug_backtrace }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up official CPython 3.14.8
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.8"
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true
          cache-dependency-glob: requirements-py314.lock
      - name: Install full hash-locked voice runtime and OS debugger
        run: |
          set -euo pipefail
          uv pip install --system --python python --require-hashes -r requirements-py314.lock
          uv pip check --python python
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gdb
          gdb --version | head -1
      - name: Capture allocator-domain crash stack without changing production
        run: |
          set -euo pipefail
          ulimit -c 0
          # This is a diagnostic of an *expected* failing extension finalizer.
          # Keep original traceback and crash status, not secrets or user data.
          set +e
          gdb --batch --quiet \
            -ex 'set pagination off' \
            -ex 'set debuginfod enabled off' \
            -ex 'set print static off' \
            -ex 'handle SIGABRT stop print nopass' \
            -ex run \
            -ex 'thread apply all bt 60' \
            -ex 'info sharedlibrary' \
            --args python -X dev -W error::ResourceWarning -c 'import ctranslate2; print(ctranslate2.__version__)' \
            > python314-native-gdb.log 2>&1
          debugger_exit=$?
          set -e
          echo "GDB exit status: $debugger_exit" >> python314-native-gdb.log
          echo "Diagnostic only: no production promotion permitted." >> "$GITHUB_STEP_SUMMARY"
          cat python314-native-gdb.log
          if ! grep -Eq 'PyMem_DebugRawFree|PyMem_DebugCheckAddress|SIGABRT|Program received signal' python314-native-gdb.log; then
            echo "::error::Expected native shutdown failure was not captured; investigate environment"
            exit 1
          fi
      - name: Compare pybind11 docstring allocator versions with a synthetic extension
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pybind-allocator-probe"
          cat > "$RUNNER_TEMP/pybind-allocator-probe/_palloc.cpp" <<'CPP'
          #include <pybind11/pybind11.h>
          namespace py = pybind11;
          struct Probe {};
          PYBIND11_MODULE(_palloc, m) {
            py::class_<Probe>(m, "Probe", "Synthetic C++ heap-type documentation with no user data.")
              .def(py::init<>());
          }
          CPP
          ulimit -c 0
          suffix=$(python -c 'import sysconfig; print(sysconfig.get_config_var("EXT_SUFFIX"))')
          for version in 2.11.1 2.13.6 3.0.1; do
            uv pip install --system --python python --no-deps "pybind11==$version"
            mkdir -p "$RUNNER_TEMP/pybind-allocator-probe/$version"
            set +e
            g++ -O0 -shared -std=c++17 -fPIC $(python -m pybind11 --includes) \
              "$RUNNER_TEMP/pybind-allocator-probe/_palloc.cpp" \
              -o "$RUNNER_TEMP/pybind-allocator-probe/$version/_palloc$suffix" \
              > "$RUNNER_TEMP/pybind-allocator-probe/compile-$version.log" 2>&1
            compiled=$?
            if (( compiled == 0 )); then
              PYTHONPATH="$RUNNER_TEMP/pybind-allocator-probe/$version" \
                python -X dev -W error::ResourceWarning \
                -c 'import _palloc; print(_palloc.Probe.__doc__)' \
                > "$RUNNER_TEMP/pybind-allocator-probe/exit-$version.log" 2>&1
              result=$?
            else
              result="not-compiled"
            fi
            set -e
            echo "pybind11=$version compiled=$compiled exit=$result" \
              | tee -a python314-pybind-allocation-probe.log
            if (( compiled != 0 )); then
              tail -20 "$RUNNER_TEMP/pybind-allocator-probe/compile-$version.log" \
                | tee -a python314-pybind-allocation-probe.log
            else
              tail -13 "$RUNNER_TEMP/pybind-allocator-probe/exit-$version.log" \
                | tee -a python314-pybind-allocation-probe.log
            fi
            if [[ "$version" == "3.0.1" && "$result" != "0" ]]; then
              echo "::error::Modern pybind11 allocator candidate did not pass strict exit"
              exit 1
            fi
          done
      - name: Rebuild only CTranslate2 Python binding with corrected pybind11 (isolated trial)
        run: |
          set -euo pipefail
          echo "Experimental build only. No replacement or repackaging of production wheel." | tee python314-patched-native-candidate.log
          root="$RUNNER_TEMP/ct2-binding-candidate"
          mkdir -p "$root/lib"
          git clone --quiet --depth 1 --branch v4.8.2 \
            https://github.com/OpenNMT/CTranslate2.git "$RUNNER_TEMP/ctranslate2-upstream"
          candidate_sha=$(git -C "$RUNNER_TEMP/ctranslate2-upstream" rev-parse HEAD)
          if [[ "$candidate_sha" != "d44d2d069eb88c7b7804da864c10c201501cb4a9" ]]; then
            echo "::error::Unexpected upstream CTranslate2 source commit"
            exit 1
          fi
          ln -s "$RUNNER_TEMP/ctranslate2-upstream/include" "$root/include"
          # Reuse the exact native core shared library from the reviewed
          # hash-locked official wheel already installed above. Do NOT build
          # a different model engine or substitute wheel ABI tags.
          native_lib=$(python - <<'PYCODE'
          from pathlib import Path
          import ctranslate2
          wheel_root = Path(ctranslate2.__file__).resolve().parent.parent
          libs = list(wheel_root.glob("ctranslate2.libs/libctranslate2-*.so.*"))
          if len(libs) != 1:
              raise SystemExit("Expected one official, audited CTranslate2 shared library")
          print(libs[0])
          PYCODE
          )
          ln -s "$native_lib" "$root/lib/libctranslate2.so"
          export LD_LIBRARY_PATH="$(dirname "$native_lib"):${LD_LIBRARY_PATH:-}"
          uv pip install --system --python python --no-deps 'pybind11==2.13.6' 'setuptools==80.9.0' 'wheel==0.45.1'
          pushd "$RUNNER_TEMP/ctranslate2-upstream/python" >/dev/null
          export CTRANSLATE2_ROOT="$root"
          export CMAKE_BUILD_PARALLEL_LEVEL=2
          python setup.py build_ext --inplace \
            >> "$GITHUB_WORKSPACE/python314-patched-native-candidate.log" 2>&1
          popd >/dev/null
          # The debugger job installed only the production lock. Bring in
          # the reviewed, hash-locked dev tools before invoking pytest.
          uv pip install --system --python python --require-hashes -r requirements-dev-py314.lock
          uv pip check --python python
          export PYTHONPATH="$RUNNER_TEMP/ctranslate2-upstream/python:${PYTHONPATH:-}"
          # These subprocess exit checks failed for the published wheel,
          # but must succeed without suppressing debug allocation checks.
          python -X dev -W error::ResourceWarning \
            -c 'import ctranslate2, ctranslate2._ext as ext, faster_whisper; assert "ctranslate2-upstream/python" in ext.__file__, ext.__file__; print("patched_native_binding_exit=PASS", ctranslate2.__version__)' \
            2>&1 | tee -a python314-patched-native-candidate.log
          python -X dev -W error::ResourceWarning -m pytest -q -n 0 \
            tests/test_python314_native_imports.py \
            2>&1 | tee -a python314-patched-native-candidate.log
          echo "No patched native binary was published or deployed." \
            | tee -a python314-patched-native-candidate.log
      - name: Retain isolated native backtrace
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python314-native-finalizer-backtrace
          path: |
            python314-native-gdb.log
            python314-pybind-allocation-probe.log
            python314-patched-native-candidate.log
          if-no-files-found: error
          retention-days: 14
