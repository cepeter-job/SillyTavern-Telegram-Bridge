name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  python-test-shards:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true
          cache-dependency-glob: |
            requirements.lock
            requirements-dev.lock

      - name: Install locked runtime dependencies
        run: uv pip install --system --python python --require-hashes -r requirements.lock

      - name: Install development test tooling
        run: uv pip install --system --python python --require-hashes -r requirements-dev.lock

      - name: Validate dependency environment
        run: python -m pip check

      - name: Run pytest shard
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          COVERAGE_FILE: .coverage.shard-${{ matrix.shard }}
        # Only combined coverage is compared with the whole-suite floor.
        run: >-
          python -X dev -W error::ResourceWarning -m pytest -q
          -p tools.pytest_shard --shard-index="$SHARD_INDEX" --shard-count=4
          --shard-manifest=shard-manifest.json -n auto --maxprocesses=4 --dist=loadfile
          --cov --cov-fail-under=0
          --cov-report=json:coverage.json --cov-report=xml:coverage.xml
          --junitxml=pytest-results.xml --durations=20 --durations-min=1
          2>&1 | tee pytest.log

      - name: Publish pytest shard evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pytest-shard-${{ matrix.shard }}
          include-hidden-files: true
          path: |
            .coverage.shard-${{ matrix.shard }}
            shard-manifest.json
            pytest-results.xml
            pytest.log
          if-no-files-found: error
          retention-days: 14

  python-tests:
    needs: [python-test-shards]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true
          cache-dependency-glob: |
            requirements.lock
            requirements-dev.lock

      - name: Install locked runtime dependencies
        run: uv pip install --system --python python --require-hashes -r requirements.lock

      - name: Install development test tooling
        run: uv pip install --system --python python --require-hashes -r requirements-dev.lock

      - name: Validate dependency environment
        run: python -m pip check

      - name: Require successful execution of every shard
        env:
          SHARD_RESULT: ${{ needs.python-test-shards.result }}
        run: |
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "Pytest shards did not all succeed: $SHARD_RESULT"
            exit 1
          fi

      - name: Download all pytest shard evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pytest-shard-*
          path: shard-reports
          merge-multiple: false

      - name: Verify complete disjoint test inventory
        run: python tools/check_pytest_shards.py shard-reports --shards=4

      - name: Combine whole-application coverage and enforce original floor
        run: |
          python -m coverage combine --keep shard-reports/pytest-shard-*
          python -m coverage json -o coverage.json
          python -m coverage xml -o coverage.xml
          python -m coverage report

      - name: Check security-critical coverage
        run: python tools/check_security_coverage.py coverage.json

      - name: Publish regression reports and application coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: application-coverage
          include-hidden-files: true
          path: |
            coverage.json
            coverage.xml
            shard-reports/
          if-no-files-found: warn
          retention-days: 14

  miniapp-smoke:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true
          cache-dependency-glob: requirements.lock

      - name: Install locked runtime dependencies for browser fixture
        run: uv pip install --system --python python --require-hashes -r requirements.lock

      - name: Set up Node for development-only Mini App tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            tests/miniapp-ui/package-lock.json
            tests/miniapp-browser/package-lock.json
      - name: Install locked DOM test tooling
        if: ${{ matrix.browser == 'chromium' }}
        run: npm ci --prefix tests/miniapp-ui --include=dev --ignore-scripts --no-audit --no-fund
      - name: Exercise Mini App pages and session safety
        if: ${{ matrix.browser == 'chromium' }}
        env:
          MINIAPP_JSDOM_ROOT: ${{ github.workspace }}/tests/miniapp-ui
          PYTHON: python
        run: |
          npm test --prefix tests/miniapp-ui 2>&1 | tee miniapp-ui-unit.log
          node --experimental-vm-modules tools/miniapp_ui_smoke.mjs 2>&1 | tee miniapp-ui.log

      - name: Install locked development-only real browser tooling
        run: npm ci --prefix tests/miniapp-browser --include=dev --ignore-scripts --no-audit --no-fund

      - name: Cache Playwright Chromium and WebKit binaries
        id: playwright-browsers-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ runner.arch }}-${{ matrix.browser }}-${{ hashFiles('tests/miniapp-browser/package-lock.json') }}

      - name: Install pinned Chromium and WebKit engines and system dependencies
        env:
          BROWSER_ENGINE: ${{ matrix.browser }}
        run: node tests/miniapp-browser/node_modules/@playwright/test/cli.js install --with-deps "$BROWSER_ENGINE"

      - name: Report browser cache hit
        env:
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright-browsers-cache.outputs.cache-hit }}
        run: |
          echo "### Playwright browsers" >> "$GITHUB_STEP_SUMMARY"
          echo "Cache hit: ${PLAYWRIGHT_CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"

      - name: Exercise real browser recovery and mobile interaction
        env:
          PYTHON: python
          BROWSER_ENGINE: ${{ matrix.browser }}
        run: npm test --prefix tests/miniapp-browser -- --project="$BROWSER_ENGINE" 2>&1 | tee miniapp-browser.log

      - name: Publish Mini App smoke log
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: miniapp-smoke-${{ matrix.browser }}
          path: |
            miniapp-ui*.log
            miniapp-browser.log
            tests/miniapp-browser/playwright-report/
            tests/miniapp-browser/test-results/
          if-no-files-found: warn
          retention-days: 14

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history for secret scanning
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download and verify pinned Gitleaks CLI
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --silent --show-error --retry 3 --max-time 90 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan changed commits with licensed Gitleaks Action
        # Fork PRs and Dependabot cannot use the repository's Actions license
        # secret. Their required scan is the verified full-history CLI below.
        if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

      # The Action only scans the event's commit range; retain the full-history gate.
      - name: Scan repository history for secrets
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" git --config=.gitleaks.toml \
            --gitleaks-ignore-path=.gitleaksignore \
            --log-opts=--all --redact --no-banner --exit-code=1 .

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true
          cache-dependency-glob: |
            requirements.lock
            requirements-dev.lock

      - name: Install hash-locked audit tooling
        run: uv pip install --system --python python --require-hashes -r requirements-dev.lock

      - name: Set up Node for locked development toolchain audits
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Audit locked dependencies
        run: python tools/audit_dependencies.py --output-dir dependency-audit-reports

      - name: Publish dependency audit reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-audit
          path: dependency-audit-reports/
          if-no-files-found: warn
          retention-days: 14

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate all GitHub Actions workflows
        run: |
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --retry 3 --max-time 90 \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check --status
          tar --no-same-owner -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          chmod 0755 "$RUNNER_TEMP/actionlint"
          # Check Actions syntax and expressions independently of runner-installed linters.
          "$RUNNER_TEMP/actionlint" -shellcheck="" -pyflakes=""

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true
          cache-dependency-glob: |
            requirements-dev.lock

      - name: Install static analysis tooling
        run: uv pip install --system --python python --require-hashes -r requirements-dev.lock

      - name: Check runtime lock and manifests
        run: python tools/check_dependency_lock.py

      - name: Ratchet Python module sizes against the reviewed base
        # Compare with the revision the change was reviewed against: the
        # pull-request base, or the pre-push tip of the branch. A revision that
        # is unavailable, is the all-zero new-branch value, or predates
        # tools/module_size_baseline.json would make the tool measure that older
        # tree as today's caps, so such a candidate is skipped in favour of the
        # head commit's parent and, failing that, the absolute caps alone.
        # Rationale and evidence: .github/workflows/README.md.
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base_ref=""
          for candidate in "$PR_BASE_SHA" "$PUSH_BEFORE_SHA" \
            "$(git rev-parse --verify --quiet "${GITHUB_SHA}^" || true)"; do
            [ -n "$candidate" ] || continue
            git cat-file -e "${candidate}^{commit}" 2>/dev/null || continue
            if git cat-file -e "${candidate}:tools/module_size_baseline.json" 2>/dev/null; then
              base_ref="$candidate"
              break
            fi
          done
          if [ -z "$base_ref" ]; then
            echo "No reviewed base revision is available; enforcing the absolute caps only."
            python tools/check_module_sizes.py
          else
            echo "Size ratchet base revision: ${base_ref}"
            python tools/check_module_sizes.py --base-ref "$base_ref"
          fi

      - name: Audit Python, installer and worker reference evidence
        run: python -m tools.audit_module_references --output module-references.json

      - name: Check dependency direction
        run: python tools/static_analysis.py

      - name: Scan production tree for leak-shaped code
        run: python tools/leakscan.py bridge/ --fail-on high --format markdown -o leakscan.md

      - name: Publish static analysis reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: memory-leak-scan
          path: |
            leakscan.md
            module-references.json
          if-no-files-found: warn
          retention-days: 14

      - name: Lint complete Python tree
        run: python -m ruff check .

      - name: Check Python formatting
        run: python -m ruff format --check .

      - name: Check typed-surface baseline
        run: |
          count=$(python tools/static_analysis.py --print-type-target-count)
          minimum=$(python -c 'import json; print(json.load(open("tools/type_surface_baseline.json"))["minimum_typed_files"])')
          echo "typed_files=$count minimum=$minimum"
          test "$count" -ge "$minimum"

      - name: Run mypy static surface
        run: python tools/static_analysis.py --print-type-targets | xargs python -m mypy

  # Preserve the existing branch-protected context; all independent checks feed it.
  # Scope, provenance and retirement conditions are in .github/workflows/README.md.
  test:
    name: test
    if: ${{ always() }}
    needs: [python-tests, miniapp-smoke, secret-scan, dependency-audit, static-analysis]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Require complete CI success
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python tools/ci_gate.py
