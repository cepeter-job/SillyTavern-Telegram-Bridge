name: Adjudication workspace
on:
  pull_request:
permissions:
  contents: read
jobs:
  source-snapshot:
    if: github.head_ref == 'feat/natural-action-adjudication'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=zip --output=source-snapshot.zip HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: adjudication-source-snapshot
          path: source-snapshot.zip
          retention-days: 1
