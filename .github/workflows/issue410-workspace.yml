# Temporary, branch-scoped maintenance; the publisher removes it before merging.
name: Issue 410 workspace
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  finish-test-environment:
    if: github.repository == 'cepeter/SillyTavern-Telegram-Bridge' && github.actor == 'cepeter' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/issue410-job-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Add the two reviewed JSDOM globals
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/miniapp_ui_smoke.mjs')
          source = path.read_text()
          anchor = 'dom.window.AbortSignal=globalThis.AbortSignal;\n'
          assert source.count(anchor) == 1
          assert 'dom.window.TextEncoder=globalThis.TextEncoder;' not in source
          path.write_text(source.replace(anchor, anchor + "dom.window.TextEncoder=globalThis.TextEncoder;\nObject.defineProperty(dom.window.crypto,'subtle',{value:globalThis.crypto.subtle});\n"))
          PY
          git add tools/miniapp_ui_smoke.mjs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test(miniapp): provide native crypto in the isolated DOM fixture'
          # Fast-forward only: concurrent edits cause a rejection, never an overwrite.
          git push origin HEAD:refs/heads/fix/issue410-job-recovery
