# Optional, maintainer-dispatched Windows validation.
# NEVER enable pull_request or pull_request_target on a personal self-hosted runner.
name: Optional Windows CI (puntoap)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Select GitHub-hosted Windows or manually activated puntoap'
        required: true
        type: choice
        default: github-hosted
        options:
          - github-hosted
          - puntoap
      suite:
        description: 'Compile-only smoke test or experimental Windows pytest'
        required: true
        type: choice
        default: compile
        options:
          - compile
          - pytest

permissions:
  contents: read

concurrency:
  group: optional-windows-${{ github.ref }}-${{ inputs.runner }}
  cancel-in-progress: false

jobs:
  optional-windows:
    # Run only trusted repository main, never a fork PR or a feature branch.
    if: ${{ github.repository == 'cepeter-job/SillyTavern-Telegram-Bridge' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ inputs.runner == 'puntoap' && fromJSON('["self-hosted","Windows","X64","puntoap"]') || 'windows-latest' }}
    timeout-minutes: 60
    steps:
      - name: Checkout trusted main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Show runner toolchain
        shell: powershell
        run: |
          python --version
          git --version
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $env:RUNNER_OS"

      - name: Compile Python source
        shell: powershell
        run: |
          python -m compileall -q -f bridge tools sillytavern_telegram_bridge.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install pinned uv for optional tests
        if: ${{ inputs.suite == 'pytest' }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.22'
          enable-cache: false

      - name: Install hash-locked Python dependencies
        if: ${{ inputs.suite == 'pytest' }}
        shell: powershell
        run: |
          uv pip install --system --python python --require-hashes -r requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --system --python python --require-hashes -r requirements-dev.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run experimental Windows tests
        if: ${{ inputs.suite == 'pytest' }}
        shell: powershell
        run: |
          python -m pytest -q -n 4 --dist=loadfile --maxfail=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
