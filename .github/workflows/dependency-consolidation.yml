name: Temporary dependency consolidation

on:
  push:
    branches: [chore/consolidate-dependencies-20261020]

permissions:
  contents: read

concurrency:
  group: dependency-consolidation-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  generate-dependency-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install reviewed compiler
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: false
      - name: Generate bounded dependency updates and provenance
        run: python tools/dependency_consolidation.py
      - name: Retain generated bytes and provenance
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-consolidation-${{ github.sha }}
          path: dependency-evidence/
          if-no-files-found: error
          retention-days: 14

  transfer-dependency-evidence:
    needs: [generate-dependency-evidence]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        lock:
          - requirements.lock
          - requirements-dev.lock
          - requirements-py314.lock
          - requirements-dev-py314.lock
    steps:
      - name: Checkout exact transfer verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download same-run generated evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-consolidation-${{ github.sha }}
          path: dependency-evidence
      - name: Emit bounded exact bytes for connector transfer
        env:
          LOCK_FILE: ${{ matrix.lock }}
        run: python3 tools/dependency_consolidation.py "$LOCK_FILE"
